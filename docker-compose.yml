# Trilha de AM (ARCHITECTURE.md, seção 12). Antes do primeiro uso: cp .env.example .env
# `docker compose up` sobe a solução inteira; jupyter (profile dev) e tooling (profile tooling)
# rodam sob demanda.

# Ambiente comum aos containers Python que falam com o banco, o MLflow e o broker.
x-ambiente-python: &ambiente-python
  POSTGRES_USER: ${POSTGRES_USER:-viario}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-viario}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MQTT_USER: ${MQTT_USER:-viario}
  MQTT_PASSWORD: ${MQTT_PASSWORD}
  # O UID do AIRFLOW_UID não tem nome nem home na imagem: USER evita o aviso do MLflow ao marcar o
  # autor do run, HOME dá um diretório gravável, e o MLflow não procura o git (ausente na imagem).
  USER: viario
  HOME: /tmp
  GIT_PYTHON_REFRESH: quiet
  # Uma thread de BLAS por processo: o RandomForest já paraleliza (n_jobs=-1), e dois treinos
  # simultâneos com BLAS multithread disputavam os núcleos (a CV da LR passou de 1 h).
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

x-ambiente-airflow: &ambiente-airflow
  <<: *ambiente-python
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-viario}:${POSTGRES_PASSWORD}@postgres:5432/airflow
  # No Airflow 3 as tarefas falam com o api-server; o segredo assina os tokens delas e tem de ser o
  # mesmo em todos os serviços do Airflow.
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina AIRFLOW_JWT_SECRET no .env (cp .env.example .env)}
  # O token da tarefa vale 10 min por padrão; tarefas de treino passam de 1 h e o heartbeat caía
  # com "Invalid auth token". 24 h cobre a dag_treino inteira.
  AIRFLOW__EXECUTION_API__JWT_EXPIRATION_TIME: "86400"
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-admin}:admin
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/senhas.json
  AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?defina AIRFLOW_ADMIN_PASSWORD no .env (cp .env.example .env)}

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  user: "${AIRFLOW_UID:-50000}:0"
  environment: *ambiente-airflow
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/app/src:ro
    - ./tests:/app/tests:ro
    - ./data:/app/data
    - airflow_logs:/opt/airflow/logs
  restart: unless-stopped

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-viario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (cp .env.example .env)}
      POSTGRES_DB: ${POSTGRES_DB:-viario}
    ports: ["${POSTGRES_PORT:-5433}:5432"]
    volumes:
      # Volume nomeado, não bind mount: o Postgres exige dono e permissão 0700 no diretório
      # de dados, o que um bind mount em NTFS (Windows) não garante.
      - pgdata:/var/lib/postgresql/data
      # Cria os bancos do MLflow e do Airflow na primeira subida (só .sql: não depende de bit de execução).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: the init-time temp server is socket-only, so this waits for the real one
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER:-viario}", "-d", "${POSTGRES_DB:-viario}"]
      interval: 2s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USER: ${MQTT_USER:-viario}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?defina MQTT_PASSWORD no .env (cp .env.example .env)}
    # O arquivo de senha é gerado a cada subida a partir do .env, dentro do container (sem bind
    # mount, então sem problema de permissão no Windows), com o dono e o modo que o mosquitto exige.
    command:
      - sh
      - -c
      - >-
        mosquitto_passwd -c -b /mosquitto/data/passwd "$$MQTT_USER" "$$MQTT_PASSWORD" &&
        chown mosquitto:mosquitto /mosquitto/data/passwd && chmod 0700 /mosquitto/data/passwd &&
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    ports: ["${MQTT_PORT:-1883}:1883"]
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # Conecta com usuário e senha e lê um tópico $SYS retido: prova que o broker aceita login.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 3"]
      interval: 5s
      retries: 12

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # POSTGRES_PASSWORD entra na URI: use só caracteres que não precisem de escape em URL.
      # +psycopg2 explícito: no SQLAlchemy 2.1, postgresql:// sozinho procura o psycopg 3, que não está no requirements.
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-viario}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      # O MLflow 3 recusa Host fora de localhost/IP privado; `mlflow` é o nome na rede do compose.
      MLFLOW_SERVER_ALLOWED_HOSTS: mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*
    ports: ["${MLFLOW_PORT:-5000}:5000"]
    volumes:
      # Só o mlflow monta os artefatos; os clientes leem e gravam por HTTP (serve-artifacts, seção 7).
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 5s
      retries: 30

  airflow-init:
    <<: *airflow
    command: ["airflow", "db", "migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-api-server:
    <<: *airflow
    # O simple auth manager do Airflow 3 lê usuário e senha deste arquivo, gerado a partir do .env.
    command:
      - sh
      - -c
      - >-
        python -c "import json, os; json.dump({os.environ['AIRFLOW_ADMIN_USER']: os.environ['AIRFLOW_ADMIN_PASSWORD']}, open('/opt/airflow/senhas.json', 'w'))" &&
        exec airflow api-server --port 8080
    ports: ["${AIRFLOW_PORT:-8080}:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"]
      interval: 10s
      retries: 30
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: ["airflow", "scheduler"]
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "SchedulerJob", "--local"]
      interval: 30s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-api-server:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow
    command: ["airflow", "dag-processor"]
    healthcheck:
      test: ["CMD", "airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
      interval: 30s
      retries: 10
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  ingestor:
    build:
      context: .
      dockerfile: docker/ingestor/Dockerfile
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *ambiente-python
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  simulador:
    build:
      context: .
      dockerfile: docker/simulador/Dockerfile
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      <<: *ambiente-python
      SIMULADOR_INTERVALO_S: ${SIMULADOR_INTERVALO_S:-2}
    volumes:
      - ./src:/app/src:ro
      - ./embedded:/app/embedded:ro
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      <<: *ambiente-python
      # Com o MLflow fora, o padrão (7 tentativas, 120 s cada) prendia threads da API por minutos.
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "1"
      MLFLOW_HTTP_REQUEST_TIMEOUT: "10"
    ports: ["${API_PORT:-8000}:8000"]
    volumes:
      # tests/ e data/ montados para `docker compose run --rm api pytest` (seção 12).
      - ./src:/app/src:ro
      - ./api:/app/api:ro
      - ./embedded:/app/embedded:ro
      - ./tests:/app/tests:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      <<: *ambiente-python
      API_URL: http://api:8000
      AIRFLOW_URL: http://airflow-api-server:8080
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    ports: ["${DASHBOARD_PORT:-8501}:8501"]
    volumes:
      - ./src:/app/src:ro
      - ./app:/app/app:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  # Notebooks: docker compose --profile dev up jupyter  (http://localhost:8888, token do .env)
  jupyter:
    build:
      context: .
      dockerfile: docker/jupyter/Dockerfile
    profiles: ["dev"]
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      <<: *ambiente-python
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:?defina JUPYTER_TOKEN no .env (cp .env.example .env)}
    ports: ["${JUPYTER_PORT:-8888}:8888"]
    volumes:
      - ./notebooks:/app/notebooks
      - ./src:/app/src:ro
      - ./data:/app/data

  # Ingestão, preparo, treino e testes, sob demanda: docker compose run --rm tooling <comando>
  # O profile evita que `docker compose up` suba este serviço sem comando.
  tooling:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    profiles: ["tooling"]
    # UID do host (Linux) para os arquivos gravados em ./data não ficarem de root; GID 0 como no Airflow.
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    environment: *ambiente-python
    volumes:
      # Só o que a trilha de AM usa: legado/ fica fora do container e não pode ser importado.
      # Tudo roda via `python -m`, sem depender de bit de execução (que NTFS não tem).
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./embedded:/app/embedded:ro
      - ./api:/app/api:ro
      - ./data:/app/data
      - ./reports:/app/reports  # src/modelagem/exportar.py grava reports/resultados/

volumes:
  pgdata:
  mlflow_artifacts:
  airflow_logs:
